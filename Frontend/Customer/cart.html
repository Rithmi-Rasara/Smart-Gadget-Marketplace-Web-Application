<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <title>My Cart | Smart Gadget Marketplace</title>

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Segoe UI", sans-serif;
      }

      body {
        background: #0a0f1f;
        color: white;
      }

      /* Header */

      .header {
        background: #050816;

        padding: 20px;

        display: flex;

        justify-content: space-between;

        align-items: center;

        border-bottom: 1px solid #1e293b;
      }

      .header h1 {
        color: #4da8ff;
      }

      button {
        background: #4da8ff;

        color: white;

        border: none;

        padding: 12px 20px;

        border-radius: 8px;

        cursor: pointer;
      }

      button:hover {
        background: #2563eb;
      }

      /* Container */

      .container {
        padding: 40px;
      }

      .cart-box {
        background: #111827;

        border: 1px solid #1e293b;

        border-radius: 15px;

        padding: 25px;
      }

      .cart-item {
        display: flex;

        justify-content: space-between;

        align-items: center;

        background: #1f2937;

        padding: 20px;

        border-radius: 10px;

        margin-bottom: 15px;
      }

      .product-name {
        font-size: 20px;

        color: #4da8ff;
      }

      .price {
        color: #4da8ff;

        font-size: 18px;
      }

      .qty {
        color: #aaa;
      }

      .total-box {
        margin-top: 30px;

        background: #111827;

        padding: 25px;

        border-radius: 15px;

        border: 1px solid #1e293b;

        text-align: right;
      }

      .total-box h2 {
        color: #4da8ff;
      }

      .checkout-btn {
        margin-top: 20px;

        width: 200px;

        font-size: 16px;
      }

      .empty {
        text-align: center;

        font-size: 20px;

        color: #aaa;

        padding: 40px;
      }
    </style>
  </head>

  <body>
    <div class="header">
      <h1>
        <i class="fas fa-cart-shopping"></i>

        My Cart
      </h1>

      <button onclick="goShop()">Continue Shopping</button>
    </div>

    <div class="container">
      <div class="cart-box">
        <h2>Cart Items</h2>

        <br />

        <div id="cartList"></div>

        <div class="total-box">
          <h2>
            Total : Rs.

            <span id="total"> 0 </span>
          </h2>

          <button class="checkout-btn" onclick="checkout()">
            <i class="fas fa-credit-card"></i>

            Checkout
          </button>
        </div>
      </div>
    </div>

    <script src="js/cart.js"></script>
  </body>
</html>

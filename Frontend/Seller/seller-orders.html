<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<title>Seller Orders | Smart Gadget Marketplace</title>


<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">


<style>

*{

margin:0;
padding:0;
box-sizing:border-box;
font-family:'Segoe UI',sans-serif;

}


body{

background:#0A0F1F;
color:white;

}



/* HEADER */


.header{

background:#050816;

padding:20px 40px;

display:flex;

justify-content:space-between;

align-items:center;

border-bottom:1px solid #1E293B;

}


.header h1{

color:#4DA8FF;

}



.logout{

background:#1F2937;

color:#4DA8FF;

border:1px solid #4DA8FF;

padding:10px 22px;

border-radius:8px;

cursor:pointer;

}



.logout:hover{

background:#4DA8FF;

color:white;

}





/* CONTAINER */


.container{

padding:40px;

}




.title{

font-size:28px;

margin-bottom:30px;

color:#4DA8FF;

}




/* ORDER CARD */


.order-card{


background:#111827;

border:1px solid #1E293B;

border-radius:15px;

padding:25px;

margin-bottom:25px;

box-shadow:0 0 15px rgba(77,168,255,.15);


}



.order-card h2{

color:#4DA8FF;

margin-bottom:20px;

}



.info{

background:#1F2937;

padding:20px;

border-radius:10px;

}



.info p{

margin:12px 0;

}




.status{


padding:5px 12px;

border-radius:20px;

background:#2563EB;

}





.actions{


margin-top:20px;

display:flex;

gap:15px;


}



button{


padding:12px 25px;

border:none;

border-radius:8px;

cursor:pointer;

font-size:14px;

}



.ship-btn{

background:#f59e0b;

color:white;

}



.ship-btn:hover{

background:#d97706;

}





.deliver-btn{

background:#22c55e;

color:white;

}



.deliver-btn:hover{

background:#16a34a;

}




.empty{

text-align:center;

font-size:20px;

color:#94a3b8;

padding:50px;

}


</style>


</head>



<body>



<div class="header">


<h1>

<i class="fas fa-box"></i>

Seller Orders

</h1>



<button class="logout" onclick="logout()">

<i class="fas fa-sign-out-alt"></i>

Logout

</button>


</div>







<div class="container">


<h2 class="title">

Customer Orders

</h2>



<div id="orderList">


</div>


</div>




<script src="./seller-orders.js"></script>

</script>



</body>


</html>

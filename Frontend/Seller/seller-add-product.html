<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Add Product</title>

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Segoe UI", sans-serif;
      }

      body {
        background: #0a0f1f;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        padding: 30px;
      }

      .form-card {
        width: 650px;
        background: #111827;
        padding: 35px;
        border-radius: 18px;
        box-shadow: 0 15px 40px rgba(0, 0, 0, 0.45);
        border: 1px solid #1e293b;
      }

      .form-card h2 {
        text-align: center;
        color: #4da8ff;
        margin-bottom: 30px;
        font-size: 30px;
      }

      .grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 18px;
      }

      .input-group {
        display: flex;
        flex-direction: column;
      }

      .input-group.full {
        grid-column: 1/3;
      }

      label {
        margin-bottom: 8px;
        font-size: 14px;
        color: #cbd5e1;
        font-weight: 600;
      }

      .input-box {
        position: relative;
      }

      .input-box i {
        position: absolute;
        left: 15px;
        top: 50%;
        transform: translateY(-50%);
        color: #4da8ff;
        font-size: 15px;
      }

      input,
      select,
      textarea {
        width: 100%;
        padding: 13px 15px 13px 45px;
        background: #0a0f1f;
        border: 1px solid #334155;
        border-radius: 10px;
        color: white;
        font-size: 15px;
        transition: 0.3s;
        outline: none;
      }

      textarea {
        padding-top: 14px;
        min-height: 120px;
        resize: none;
      }

      input:focus,
      select:focus,
      textarea:focus {
        border-color: #4da8ff;
        box-shadow: 0 0 15px rgba(77, 168, 255, 0.3);
      }

      button {
        margin-top: 25px;
        width: 100%;
        padding: 15px;
        border: none;
        border-radius: 12px;
        background: linear-gradient(90deg, #4da8ff, #2563eb);
        color: white;
        font-size: 17px;
        font-weight: bold;
        cursor: pointer;
        transition: 0.3s;
      }

      button:hover {
        transform: translateY(-2px);
        box-shadow: 0 10px 25px rgba(77, 168, 255, 0.35);
      }

      @media (max-width: 700px) {
        .form-card {
          width: 100%;
        }

        .grid {
          grid-template-columns: 1fr;
        }

        .input-group.full {
          grid-column: auto;
        }
      }
    </style>
  </head>

  <body>
    <div class="form-card">
      <h2>
        <i class="fa-solid fa-box-open"></i>
        Add New Product
      </h2>

      <form>
        <div class="grid">
          <div class="input-group">
            <label>Product Name</label>

            <div class="input-box">
              <i class="fa-solid fa-tag"></i>

              <input id="product_name" placeholder="Enter Product Name" />
            </div>
          </div>

          <div class="input-group">
            <label>Category</label>

            <div class="input-box">
              <i class="fa-solid fa-layer-group"></i>

              <select id="category_id">
                <option value="1">Tablets</option>

                <option value="2">Gaming Consoles</option>

                <option value="3">Computer Components</option>

                <option value="21">Smartwatches</option>
              </select>
            </div>
          </div>

          <div class="input-group">
            <label>Price (Rs.)</label>

            <div class="input-box">
              <i class="fa-solid fa-dollar-sign"></i>

              <input id="price" type="number" placeholder="Enter Price" />
            </div>
          </div>

          <div class="input-group">
            <label>Stock Quantity</label>

            <div class="input-box">
              <i class="fa-solid fa-cubes"></i>

              <input
                id="stock_quantity"
                type="number"
                placeholder="Enter Stock"
              />
            </div>
          </div>

          <div class="input-group full">
            <label>Description</label>

            <div class="input-box">
              <i class="fa-solid fa-file-lines" style="top: 22px"></i>

              <textarea
                id="description"
                placeholder="Enter Product Description"
              ></textarea>
            </div>
          </div>
        </div>

        <button type="button" onclick="saveProduct()">
          <i class="fa-solid fa-floppy-disk"></i>
          Save Product
        </button>
      </form>
    </div>

    <script>
      async function saveProduct() {
        const user = JSON.parse(localStorage.getItem("user"));

        if (!user) {
          alert("Please Login");
          return;
        }

        const data = {
          product_name: document.getElementById("product_name").value,

          category_id: document.getElementById("category_id").value,

          price: document.getElementById("price").value,

          stock_quantity: document.getElementById("stock_quantity").value,

          description: document.getElementById("description").value,

          seller_id: user.SELLER_ID,
        };

        if (!data.product_name) {
          alert("Enter Product Name");
          return;
        }

        const res = await fetch("http://localhost:3000/api/seller/products", {
          method: "POST",

          headers: {
            "Content-Type": "application/json",
          },

          body: JSON.stringify(data),
        });

        const result = await res.json();

        alert(result.message);

        if (result.success) {
          window.location.href = "seller-products.html";
        }
      }
    </script>
  </body>
</html>

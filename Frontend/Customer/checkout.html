<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <title>Checkout | Smart Gadget Marketplace</title>

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Segoe UI", sans-serif;
      }

      body {
        background: #0a0f1f;
        color: white;
      }

      /* Header */

      .header {
        background: #050816;

        padding: 20px;

        display: flex;

        justify-content: space-between;

        align-items: center;

        border-bottom: 1px solid #1e293b;
      }

      .header h1 {
        color: #4da8ff;
      }

      button {
        background: #4da8ff;

        color: white;

        border: none;

        padding: 12px 25px;

        border-radius: 8px;

        cursor: pointer;

        font-size: 15px;
      }

      button:hover {
        background: #2563eb;
      }

      /* Checkout */

      .container {
        padding: 40px;

        display: flex;

        justify-content: center;
      }

      .checkout-box {
        width: 500px;

        background: #111827;

        border: 1px solid #1e293b;

        border-radius: 15px;

        padding: 35px;

        box-shadow: 0 0 20px rgba(77, 168, 255, 0.2);
      }

      .checkout-box h2 {
        color: #4da8ff;

        text-align: center;

        margin-bottom: 30px;
      }

      .info {
        background: #1f2937;

        padding: 20px;

        border-radius: 10px;

        margin-bottom: 25px;
      }

      .info p {
        margin: 12px 0;
      }

      input,
      textarea,
      select {
        width: 100%;

        padding: 12px;

        margin-top: 8px;

        margin-bottom: 15px;

        border: none;

        outline: none;

        border-radius: 8px;

        background: #1f2937;

        color: white;
      }

      textarea {
        height: 100px;

        resize: none;
      }

      .place-btn {
        width: 100%;

        margin-top: 20px;

        font-size: 16px;
      }
    </style>
  </head>

  <body>
    <div class="header">
      <h1>
        <i class="fas fa-credit-card"></i>

        Checkout
      </h1>

      <button onclick="backCart()">Cart</button>
    </div>

    <div class="container">
      <div class="checkout-box">
        <h2>Order Confirmation</h2>

        <div class="info">
          <p>
            <i class="fas fa-user"></i>

            Customer :

            <span id="customerName"> Loading... </span>
          </p>

          <p>
            <i class="fas fa-shopping-cart"></i>

            Order Items :

            <span id="itemCount"> 0 </span>
          </p>

          <p>
            <i class="fas fa-money-bill"></i>

            Total : Rs.

            <span id="totalAmount"> 0 </span>
          </p>
        </div>

        <label> Delivery Address </label>

        <textarea id="address" placeholder="Enter delivery address"></textarea>

        <label> Payment Method </label>

        <select id="payment">
          <option>Cash On Delivery</option>

          <option>Card Payment</option>

          <option>Online Banking</option>
        </select>

        <button onclick="createOrder()">
          <i class="fas fa-check"></i>

          Place Order
        </button>
      </div>
    </div>

    <script src="js/checkout.js"></script>
  </body>
</html>

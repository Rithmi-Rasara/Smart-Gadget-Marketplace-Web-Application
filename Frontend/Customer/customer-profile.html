<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Customer Profile</title>

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Segoe UI", sans-serif;
      }

      body {
        background: #0a0f1f;
        color: white;
      }

      /* HEADER */

      .header {
        background: #050816;
        padding: 20px 40px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-bottom: 1px solid #1e293b;
      }

      .header h1 {
        color: #4da8ff;
        font-size: 28px;
      }

      .header button {
        background: #1f2937;
        color: #4da8ff;
        border: 1px solid #4da8ff;
        padding: 10px 20px;
        border-radius: 8px;
        cursor: pointer;
        transition: 0.3s;
      }

      .header button:hover {
        background: #4da8ff;
        color: white;
      }

      /* CONTAINER */

      .container {
        display: flex;
        justify-content: center;
        padding: 40px;
      }

      /* CARD */

      .profile-card {
        width: 650px;

        background: #111827;

        border: 1px solid #1e293b;

        border-radius: 18px;

        padding: 35px;

        box-shadow: 0 0 30px rgba(77, 168, 255, 0.15);
      }

      /* PROFILE */

      .profile-top {
        text-align: center;
        margin-bottom: 30px;
      }

      .profile-image {
        width: 110px;

        height: 110px;

        background: #1f2937;

        border: 4px solid #4da8ff;

        border-radius: 50%;

        display: flex;

        justify-content: center;

        align-items: center;

        margin: auto;

        font-size: 50px;

        color: #4da8ff;

        margin-bottom: 15px;
      }

      .profile-top h2 {
        color: #4da8ff;
        margin-bottom: 5px;
      }

      .profile-top p {
        color: #94a3b8;
      }

      /* FORM */

      .form-group {
        margin-bottom: 18px;
      }

      .form-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 20px;
      }

      label {
        display: block;
        margin-bottom: 8px;
        color: #94a3b8;
        font-weight: 600;
      }

      input,
      textarea {
        width: 100%;

        padding: 14px;

        background: #1f2937;

        border: 1px solid #334155;

        border-radius: 8px;

        color: white;

        font-size: 15px;

        outline: none;

        transition: 0.3s;
      }

      input:focus,
      textarea:focus {
        border-color: #4da8ff;

        box-shadow: 0 0 10px rgba(77, 168, 255, 0.4);
      }

      textarea {
        resize: none;
      }

      /* STATUS */

      .status {
        display: inline-block;

        background: #16a34a;

        padding: 10px 18px;

        border-radius: 25px;

        font-weight: bold;
      }

      /* BUTTONS */

      .buttons {
        display: flex;

        gap: 15px;

        margin-top: 30px;
      }

      .update {
        flex: 1;

        background: #4da8ff;

        border: none;

        padding: 15px;

        border-radius: 8px;

        color: white;

        font-size: 16px;

        cursor: pointer;

        transition: 0.3s;
      }

      .update:hover {
        background: #2563eb;
      }

      .reset {
        flex: 1;

        background: #374151;

        border: none;

        padding: 15px;

        border-radius: 8px;

        color: white;

        font-size: 16px;

        cursor: pointer;

        transition: 0.3s;
      }

      .reset:hover {
        background: #4b5563;
      }

      /* RESPONSIVE */

      @media (max-width: 700px) {
        .profile-card {
          width: 100%;
        }

        .form-row {
          grid-template-columns: 1fr;
        }

        .header {
          padding: 20px;

          flex-direction: column;

          gap: 15px;
        }
      }
    </style>
  </head>

  <body>
    <div class="header">
      <h1>
        <i class="fas fa-user-circle"></i>

        Customer Profile
      </h1>

      <button onclick="back()">
        <i class="fas fa-arrow-left"></i>

        Dashboard
      </button>
    </div>

    <div class="container">
      <div class="profile-card">
        <div class="profile-top">
          <div class="profile-image">
            <i class="fas fa-user"></i>
          </div>

          <h2>My Profile</h2>

          <p>Manage your account information</p>
        </div>

        <form id="profileForm">
          <input type="hidden" id="customer_id" />

          <div class="form-group">
            <label>Full Name</label>

            <input type="text" id="full_name" />
          </div>

          <div class="form-group">
            <label>Email</label>

            <input type="email" id="email" />
          </div>

          <div class="form-row">
            <div class="form-group">
              <label>Phone</label>

              <input type="text" id="phone" />
            </div>

            <div class="form-group">
              <label>City</label>

              <input type="text" id="city" />
            </div>
          </div>

          <div class="form-group">
            <label>Address</label>

            <textarea id="address" rows="4"></textarea>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label>Status</label>

              <br />

              <span class="status" id="status"> ACTIVE </span>
            </div>

            <div class="form-group">
              <label>Created Date</label>

              <input type="text" id="created_date" readonly />
            </div>
          </div>

          <div class="buttons">
            <button type="button" class="update" onclick="updateProfile()">
              <i class="fas fa-save"></i>

              Update Profile
            </button>

            <button type="reset" class="reset">
              <i class="fas fa-rotate-left"></i>

              Reset
            </button>
          </div>
        </form>
      </div>
    </div>

    <script src="js/customer-profile.js"></script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Payment | Smart Gadget Marketplace</title>

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Segoe UI", sans-serif;
      }

      body {
        background: #0a0f1f;
        color: #fff;
      }

      .header {
        background: #050816;
        padding: 20px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-bottom: 1px solid #1e293b;
      }

      .header h1 {
        color: #4da8ff;
      }

      .container {
        width: 500px;
        margin: 40px auto;
        background: #111827;
        padding: 30px;
        border-radius: 15px;
        border: 1px solid #1e293b;
      }

      label {
        display: block;
        margin-top: 20px;
        margin-bottom: 8px;
      }

      input,
      select {
        width: 100%;
        padding: 12px;
        border: none;
        border-radius: 8px;
        background: #1f2937;
        color: white;
      }

      button {
        margin-top: 25px;
        width: 100%;
        padding: 15px;
        border: none;
        border-radius: 10px;
        background: #4da8ff;
        color: white;
        font-size: 18px;
        cursor: pointer;
      }

      button:hover {
        background: #2563eb;
      }

      .amount {
        font-size: 25px;
        color: #4da8ff;
        margin-bottom: 20px;
      }
    </style>
  </head>

  <body>
    <div class="header">
      <h1>
        <i class="fas fa-credit-card"></i>
        Payment
      </h1>
    </div>

    <div class="container">
      <h2 id="orderNo"></h2>

      <div class="amount" id="amount"></div>

      <label>Payment Method</label>

      <select id="method">
        <option value="CARD">Credit / Debit Card</option>

        <option value="COD">Cash On Delivery</option>

        <option value="BANK">Bank Transfer</option>
      </select>

      <button onclick="payNow()">
        <i class="fas fa-check-circle"></i>

        Confirm Payment
      </button>
    </div>

    <script src="js/payment.js"></script>
  </body>
</html>

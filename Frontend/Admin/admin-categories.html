<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<title>Admin Categories</title>


<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">


<style>


*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Segoe UI',sans-serif;
}


body{

background:#0A0F1F;
color:white;

}



.header{

background:#050816;

padding:20px 40px;

display:flex;

justify-content:space-between;

align-items:center;

border-bottom:1px solid #1E293B;

}



.header h1{

color:#4DA8FF;

}



.back{

background:#1F2937;

color:#4DA8FF;

border:1px solid #4DA8FF;

padding:10px 25px;

border-radius:8px;

cursor:pointer;

}



.container{

padding:40px;

}



.box{

background:#111827;

border:1px solid #1E293B;

border-radius:15px;

padding:30px;

margin-bottom:30px;

box-shadow:0 0 20px rgba(77,168,255,.15);

}



h2{

color:#4DA8FF;

margin-bottom:20px;

}



input,
textarea{

width:100%;

padding:14px;

margin-bottom:15px;

background:#1F2937;

border:none;

border-radius:8px;

color:white;

}



textarea{

height:100px;

resize:none;

}



.add-btn{

background:#4DA8FF;

border:none;

padding:12px 30px;

border-radius:8px;

color:white;

cursor:pointer;

}



table{

width:100%;

border-collapse:collapse;

}



th{

background:#050816;

color:#4DA8FF;

padding:15px;

text-align:left;

}



td{

padding:15px;

border-bottom:1px solid #1E293B;

color:#cbd5e1;

}



tr:hover{

background:#1F2937;

}



.delete{

background:#ef4444;

color:white;

border:none;

padding:8px 18px;

border-radius:8px;

cursor:pointer;

}



</style>


</head>


<body>



<div class="header">


<h1>

<i class="fas fa-list"></i>

Manage Categories

</h1>



<button class="back"
onclick="back()">

<i class="fas fa-arrow-left"></i>

Dashboard

</button>


</div>




<div class="container">



<div class="box">


<h2>

<i class="fas fa-plus-circle"></i>

Add Category

</h2>



<input 
id="category_name"
placeholder="Category Name">



<textarea
id="description"
placeholder="Description"></textarea>



<button class="add-btn"
onclick="addCategory()">

<i class="fas fa-plus"></i>

Add Category

</button>



</div>





<div class="box">


<h2>

All Categories

</h2>



<table>


<thead>

<tr>

<th>ID</th>

<th>Name</th>

<th>Description</th>

<th>Action</th>

</tr>

</thead>



<tbody id="categoryList">


</tbody>



</table>



</div>



</div>




<script src="admin-categories.js"></script>


</body>

</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <title>Admin Orders | Smart Gadget Marketplace</title>

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />

    <style>
      * {
        margin: 0;
        padding: 0;

        box-sizing: border-box;

        font-family: "Segoe UI", sans-serif;
      }

      body {
        background: #0a0f1f;
        color: white;
      }

      .header {
        background: #050816;

        padding: 20px 40px;

        display: flex;

        justify-content: space-between;

        align-items: center;

        border-bottom: 1px solid #1e293b;
      }

      .header h1 {
        color: #4da8ff;
      }

      .back {
        background: #1f2937;

        color: #4da8ff;

        border: 1px solid #4da8ff;

        padding: 10px 25px;

        border-radius: 8px;

        cursor: pointer;
      }

      .back:hover {
        background: #4da8ff;

        color: white;
      }

      .container {
        padding: 40px;
      }

      .title {
        font-size: 30px;

        color: #4da8ff;

        margin-bottom: 25px;
      }

      .search-box {
        background: #111827;

        padding: 20px;

        border-radius: 12px;

        border: 1px solid #1e293b;

        margin-bottom: 25px;
      }

      .search-box input {
        width: 100%;

        padding: 14px;

        background: #1f2937;

        border: none;

        border-radius: 8px;

        color: white;

        font-size: 15px;
      }

      .table-box {
        background: #111827;

        border-radius: 15px;

        overflow: hidden;

        border: 1px solid #1e293b;

        box-shadow: 0 0 25px rgba(77, 168, 255, 0.15);
      }

      table {
        width: 100%;

        border-collapse: collapse;
      }

      thead {
        background: #050816;
      }

      th {
        padding: 18px;

        color: #4da8ff;

        text-align: left;
      }

      td {
        padding: 15px;

        border-bottom: 1px solid #1e293b;

        color: #cbd5e1;
      }

      tr:hover {
        background: #1f2937;
      }

      .status {
        padding: 6px 15px;

        border-radius: 20px;

        font-size: 13px;
      }

      .pending {
        background: #f59e0b;
      }

      .completed {
        background: #22c55e;
      }

      .cancelled {
        background: #ef4444;
      }

      .empty {
        text-align: center;

        padding: 40px;

        color: #94a3b8;
      }
    </style>
  </head>

  <body>
    <div class="header">
      <h1>
        <i class="fas fa-shopping-cart"></i>

        Manage Orders
      </h1>

      <button class="back" onclick="back()">
        <i class="fas fa-arrow-left"></i>

        Dashboard
      </button>
    </div>

    <div class="container">
      <h2 class="title">Customer Orders</h2>

      <div class="search-box">
        <input
          id="search"
          placeholder="Search Order / Customer..."
          onkeyup="searchOrder()"
        />
      </div>

      <div class="table-box">
        <table>
          <thead>
            <tr>
              <th>Order ID</th>

              <th>Customer</th>

              <th>Date</th>

              <th>Amount</th>

              <th>Order Status</th>

              <th>Delivery</th>
            </tr>
          </thead>

          <tbody id="orderList"></tbody>
        </table>
      </div>
    </div>

    <script src="admin-orders.js"></script>
  </body>
</html>

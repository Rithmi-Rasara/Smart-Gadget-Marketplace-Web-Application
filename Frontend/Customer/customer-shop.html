<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <title>Customer Shop | Smart Gadget Marketplace</title>

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    />

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Segoe UI";
      }

      body {
        background: #0a0f1f;
        color: white;
      }

      /* Header */

      .header {
        background: #050816;

        padding: 20px;

        display: flex;

        justify-content: space-between;

        align-items: center;

        border-bottom: 1px solid #1e293b;
      }

      .header h1 {
        color: #4da8ff;
      }

      button {
        background: #4da8ff;

        color: white;

        border: none;

        padding: 10px 20px;

        border-radius: 8px;

        cursor: pointer;
      }

      button:hover {
        background: #2563eb;
      }

      /* Products */

      .container {
        padding: 40px;
      }

      .products {
        display: grid;

        grid-template-columns: repeat(3, 1fr);

        gap: 25px;
      }

      .product {
        background: #111827;

        padding: 25px;

        border-radius: 15px;

        border: 1px solid #1e293b;
      }

      .product i {
        font-size: 40px;

        color: #4da8ff;

        margin-bottom: 15px;
      }

      .product h2 {
        margin-bottom: 10px;
      }

      .price {
        color: #4da8ff;

        font-size: 20px;

        margin: 10px 0;
      }

      .stock {
        color: #aaa;
      }

      @media (max-width: 900px) {
        .products {
          grid-template-columns: 1fr 1fr;
        }
      }

      @media (max-width: 600px) {
        .products {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>

  <body>
    <div class="header">
      <h1>
        <i class="fas fa-microchip"></i>

        Smart Gadget Shop
      </h1>

      <button onclick="goBack()">Dashboard</button>
    </div>

    <div class="container">
      <h2>Available Products</h2>

      <br />

      <div class="products" id="productList"></div>
    </div>

    <script src="js/shop.js"></script>
  </body>
</html>

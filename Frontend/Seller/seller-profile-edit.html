<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Edit Shop Profile</title>

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Segoe UI", sans-serif;
      }

      body {
        background: #0a0f1f;
        color: white;
        display: flex;
      }

      /* Sidebar */

      .sidebar {
        width: 260px;
        height: 100vh;
        background: #050816;
        position: fixed;
        border-right: 1px solid #1e293b;
        padding: 25px 20px;
      }

      .logo {
        font-size: 24px;
        color: #4da8ff;
        margin-bottom: 40px;
      }

      .logo i {
        margin-right: 10px;
      }

      .menu a {
        display: flex;
        align-items: center;
        gap: 15px;
        padding: 15px;
        margin-bottom: 10px;
        text-decoration: none;
        color: #cbd5e1;
        border-radius: 10px;
        transition: 0.3s;
      }

      .menu a:hover,
      .menu .active {
        background: #1e293b;
        color: #4da8ff;
      }

      .logout {
        position: absolute;
        bottom: 30px;
        width: 220px;
        padding: 12px;
        background: #111827;
        border: 1px solid #4da8ff;
        color: #4da8ff;
        border-radius: 8px;
        cursor: pointer;
      }

      .logout:hover {
        background: #4da8ff;
        color: white;
      }

      /* Main */

      .main {
        margin-left: 260px;
        width: calc(100% - 260px);
      }

      .header {
        background: #050816;
        padding: 25px 40px;
        border-bottom: 1px solid #1e293b;
      }

      .header h1 {
        color: #4da8ff;
      }

      /* Card */

      .card {
        width: 850px;
        margin: 40px auto;
        background: #111827;
        border: 1px solid #1e293b;
        border-radius: 20px;
        padding: 40px;
        box-shadow: 0 0 30px rgba(77, 168, 255, 0.15);
      }

      .profile-icon {
        text-align: center;
        margin-bottom: 30px;
      }

      .profile-icon i {
        font-size: 90px;
        color: #4da8ff;
      }

      .form-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 20px;
      }

      .input-box {
        display: flex;
        flex-direction: column;
      }

      .input-box label {
        margin-bottom: 8px;
        color: #94a3b8;
        font-size: 14px;
      }

      .input-box input,
      .input-box textarea {
        padding: 13px;
        background: #0a0f1f;
        border: 1px solid #334155;
        border-radius: 10px;
        color: white;
        outline: none;
        font-size: 15px;
      }

      .input-box input:focus,
      .input-box textarea:focus {
        border-color: #4da8ff;
        box-shadow: 0 0 10px rgba(77, 168, 255, 0.4);
      }

      textarea {
        height: 100px;
        resize: none;
      }

      .full {
        grid-column: 1/3;
      }

      .button-group {
        display: flex;
        justify-content: flex-end;
        gap: 15px;
        margin-top: 35px;
      }

      .cancel {
        background: #374151;
        border: none;
        padding: 13px 30px;
        color: white;
        border-radius: 8px;
        cursor: pointer;
      }

      .cancel:hover {
        background: #4b5563;
      }

      .save {
        background: #4da8ff;
        border: none;
        padding: 13px 35px;
        color: white;
        border-radius: 8px;
        cursor: pointer;
      }

      .save:hover {
        background: #2563eb;
      }

      @media (max-width: 900px) {
        .sidebar {
          width: 80px;
        }

        .logo span,
        .menu span {
          display: none;
        }

        .main {
          margin-left: 80px;
          width: calc(100% - 80px);
        }

        .card {
          width: 95%;
        }

        .form-grid {
          grid-template-columns: 1fr;
        }

        .full {
          grid-column: 1;
        }

        .button-group {
          flex-direction: column;
        }
      }
    </style>
  </head>

  <body>
    <div class="sidebar">
      <div class="logo">
        <i class="fas fa-store"></i>
        <span>Seller Panel</span>
      </div>

      <div class="menu">
        <a href="seller-dashboard.html">
          <i class="fas fa-home"></i>
          <span>Dashboard</span>
        </a>

        <a href="seller-products.html">
          <i class="fas fa-box"></i>
          <span>Products</span>
        </a>

        <a href="seller-orders.html">
          <i class="fas fa-shopping-cart"></i>
          <span>Orders</span>
        </a>

        <a href="seller-profile.html" class="active">
          <i class="fas fa-user"></i>
          <span>Shop Profile</span>
        </a>
      </div>

      <button class="logout" onclick="logout()">
        <i class="fas fa-sign-out-alt"></i>
        Logout
      </button>
    </div>

    <div class="main">
      <div class="header">
        <h1><i class="fas fa-edit"></i> Edit Shop Profile</h1>
      </div>

      <div class="card">
        <div class="profile-icon">
          <i class="fas fa-store"></i>
        </div>

        <form id="profileForm">
          <div class="form-grid">
            <div class="input-box">
              <label>Shop Name</label>
              <input type="text" id="shop_name" />
            </div>

            <div class="input-box">
              <label>Owner Name</label>
              <input type="text" id="owner_name" />
            </div>

            <div class="input-box">
              <label>Email</label>
              <input type="email" id="email" />
            </div>

            <div class="input-box">
              <label>Phone</label>
              <input type="text" id="phone" />
            </div>

            <div class="input-box full">
              <label>Address</label>
              <textarea id="address"></textarea>
            </div>

            <div class="input-box">
              <label>City</label>
              <input type="text" id="city" />
            </div>

            <div class="input-box">
              <label>Status</label>
              <input type="text" id="status" readonly />
            </div>
          </div>

          <div class="button-group">
            <button
              type="button"
              class="cancel"
              onclick="window.location.href = 'seller-profile.html'"
            >
              Cancel
            </button>

            <button type="button" class="save" onclick="updateProfile()">
              <i class="fas fa-save"></i>
              Save Changes
            </button>
          </div>
        </form>
      </div>
    </div>

    <script>
      let seller_id;

      document.addEventListener("DOMContentLoaded", () => {
        const params = new URLSearchParams(window.location.search);

        seller_id = params.get("seller_id");

        console.log("EDIT SELLER ID:", seller_id);

        if (!seller_id) {
          alert("Seller ID missing");

          return;
        }

        loadEditProfile();
      });

      async function loadEditProfile() {
        try {
          const response = await fetch(
            "http://localhost:3000/api/seller/profile/" + seller_id,
          );

          const data = await response.json();

          console.log(data);

          document.getElementById("shop_name").value = data.SHOP_NAME || "";

          document.getElementById("owner_name").value = data.OWNER_NAME || "";

          document.getElementById("email").value = data.EMAIL || "";

          document.getElementById("phone").value = data.PHONE || "";

          document.getElementById("address").value = data.ADDRESS || "";

          document.getElementById("city").value = data.CITY || "";

          document.getElementById("status").value = data.STATUS || "";
        } catch (error) {
          console.log(error);

          alert("Cannot load seller data");
        }
      }

      async function updateProfile() {
        const data = {
          shop_name: document.getElementById("shop_name").value,

          owner_name: document.getElementById("owner_name").value,

          email: document.getElementById("email").value,

          phone: document.getElementById("phone").value,

          address: document.getElementById("address").value,

          city: document.getElementById("city").value,
        };

        try {
          const response = await fetch(
            "http://localhost:3000/api/seller/profile/" + seller_id,

            {
              method: "PUT",

              headers: {
                "Content-Type": "application/json",
              },

              body: JSON.stringify(data),
            },
          );

          const result = await response.json();

          console.log(result);

          if (result.success) {
            alert("Profile Updated Successfully");

            window.location.href = "seller-profile.html";
          } else {
            alert(result.message);
          }
        } catch (error) {
          console.log(error);

          alert("Update Failed");
        }
      }

      function logout() {
        localStorage.removeItem("user");

        window.location.href = "../login.html";
      }
    </script>
  </body>
</html>

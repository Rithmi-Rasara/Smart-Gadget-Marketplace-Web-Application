<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <title>Seller Dashboard | Smart Gadget Marketplace</title>

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Segoe UI", sans-serif;
      }

      body {
        background: #0a0f1f;
        color: white;
        display: flex;
      }

      .sidebar {
        width: 260px;
        height: 100vh;
        position: fixed;

        background: #050816;

        border-right: 1px solid #1e293b;

        padding: 25px 20px;
      }

      .logo {
        color: #4da8ff;

        display: flex;

        align-items: center;

        gap: 12px;

        margin-bottom: 40px;
      }

      .logo i {
        font-size: 30px;
      }

      .logo h2 {
        font-size: 23px;
      }

      .menu a {
        display: flex;

        align-items: center;

        gap: 15px;

        padding: 15px;

        margin-bottom: 10px;

        text-decoration: none;

        color: #cbd5e1;

        border-radius: 10px;
      }

      .menu a:hover,
      .menu a.active {
        background: #1e293b;

        color: #4da8ff;
      }

      .logout {
        position: absolute;

        bottom: 30px;

        width: 220px;

        padding: 12px;

        background: #111827;

        border: 1px solid #4da8ff;

        color: #4da8ff;

        border-radius: 10px;
      }

      .main {
        margin-left: 260px;

        width: calc(100% - 260px);
      }

      .header {
        background: #050816;

        padding: 25px 40px;

        border-bottom: 1px solid #1e293b;

        display: flex;

        justify-content: space-between;

        align-items: center;
      }

      .header h1 {
        color: #4da8ff;
      }

      .profile {
        font-size: 30px;

        color: white;
      }

      .stats {
        padding: 35px 40px;

        display: grid;

        grid-template-columns: repeat(3, 1fr);

        gap: 25px;
      }

      .stat-card {
        background: #111827;

        border: 1px solid #1e293b;

        padding: 25px;

        border-radius: 15px;
      }

      .stat-card i {
        font-size: 35px;

        color: #4da8ff;
      }

      .stat-card h2 {
        margin-top: 15px;

        font-size: 32px;
      }

      .stat-card p {
        color: #cbd5e1;
      }

      /* ACTION CARDS */

      .title {
        margin-left: 40px;

        color: #4da8ff;
      }

      .actions {
        padding: 30px 40px;

        display: grid;

        grid-template-columns: repeat(4, 1fr);

        gap: 25px;
      }

      .action-card {
        background: #111827;

        border: 1px solid #1e293b;

        border-radius: 15px;

        padding: 30px;
      }

      .action-card i {
        font-size: 40px;

        color: #4da8ff;

        margin-bottom: 20px;
      }

      .action-card h3 {
        margin-bottom: 15px;
      }

      .action-card button {
        width: 100%;

        padding: 12px;

        background: #4da8ff;

        border: none;

        color: white;

        border-radius: 8px;

        cursor: pointer;
      }

      .action-card button:hover {
        background: #2563eb;
      }

      .footer {
        text-align: center;

        color: #64748b;

        margin: 30px;
      }

      @media (max-width: 900px) {
        .stats,
        .actions {
          grid-template-columns: 1fr;
        }

        .sidebar {
          width: 80px;
        }

        .main {
          margin-left: 80px;

          width: calc(100% - 80px);
        }

        .logo h2,
        .menu span {
          display: none;
        }
      }
    </style>
  </head>

  <body>
    <div class="sidebar">
      <div class="logo">
        <i class="fas fa-microchip"></i>

        <h2>Smart Gadget</h2>
      </div>

      <div class="menu">
        <a class="active">
          <i class="fas fa-chart-line"></i>

          <span>Dashboard</span>
        </a>

        <a href="seller-products.html">
          <i class="fas fa-box"></i>

          <span>Products</span>
        </a>

        <a href="seller-orders.html">
          <i class="fas fa-cart-shopping"></i>

          <span>Orders</span>
        </a>

        <a href="seller-profile.html">
          <i class="fas fa-user"></i>

          <span>Profile</span>
        </a>
      </div>

      <button class="logout">
        <i class="fas fa-right-from-bracket"></i>

        Logout
      </button>
    </div>

    <div class="main">
      <div class="header">
        <div>
          <h1>Seller Dashboard</h1>

          <p style="color: #cbd5e1">Welcome <span id="sellerName"></span></p>
        </div>

        <div class="profile">
          <i class="fas fa-user-circle"></i>
        </div>
      </div>

      <div class="stats">
        <div class="stat-card">
          <i class="fas fa-box"></i>

          <h2 id="totalProducts">0</h2>

          <p>Total Products</p>
        </div>

        <div class="stat-card">
          <i class="fas fa-shopping-cart"></i>

          <h2 id="totalOrders">0</h2>

          <p>Total Orders</p>
        </div>

        <div class="stat-card">
          <i class="fas fa-money-bill-wave"></i>

          <h2>Rs. <span id="totalSales">0</span></h2>

          <p>Total Revenue</p>
        </div>
      </div>

      <h2 class="title">Quick Actions</h2>

      <div class="actions">
        <div class="action-card">
          <i class="fas fa-box"></i>

          <h3>Manage Products</h3>

          <button onclick="location.href = 'seller-products.html'">Open</button>
        </div>

        <div class="action-card">
          <i class="fas fa-shopping-cart"></i>

          <h3>View Orders</h3>

          <button onclick="location.href = 'seller-orders.html'">Open</button>
        </div>

        <div class="action-card">
          <i class="fas fa-user"></i>

          <h3>Seller Profile</h3>

          <button onclick="location.href = 'seller-profile.html'">Open</button>
        </div>
      </div>

      <div class="footer">Smart Gadget Marketplace © 2026</div>
    </div>

    <script>
      document.addEventListener("DOMContentLoaded", () => {
        loadUserName();
        loadDashboard();
      });

      function loadUserName() {
        const user = JSON.parse(localStorage.getItem("user"));

        if (user) {
          document.getElementById("sellerName").innerText = user.FULL_NAME;
        }
      }

      async function loadDashboard() {
        const user = JSON.parse(localStorage.getItem("user"));

        if (!user) {
          window.location.href = "../login.html";

          return;
        }

        const seller_id = user.SELLER_ID;

        try {
          const response = await fetch(
            "http://localhost:3000/api/seller/dashboard/" + seller_id,
          );

          const data = await response.json();

          document.getElementById("totalProducts").innerText =
            data.TOTAL_PRODUCTS || 0;

          document.getElementById("totalOrders").innerText =
            data.TOTAL_ORDERS || 0;

          document.getElementById("totalSales").innerText =
            data.TOTAL_SALES || 0;
        } catch (error) {
          console.log(error);
        }
      }

      function logout() {
        localStorage.removeItem("user");

        window.location.href = "../login.html";
      }
    </script>
  </body>
</html>

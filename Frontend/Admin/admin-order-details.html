<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<title>Order Details | Admin</title>


<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">


<style>

*{

margin:0;
padding:0;

box-sizing:border-box;

font-family:'Segoe UI',sans-serif;

}


body{

background:#0A0F1F;
color:white;

}



/* HEADER */

.header{

background:#050816;

padding:20px 40px;

display:flex;

justify-content:space-between;

align-items:center;

border-bottom:1px solid #1E293B;

}


.header h1{

color:#4DA8FF;

}



.back{

background:#1F2937;

color:#4DA8FF;

border:1px solid #4DA8FF;

padding:10px 25px;

border-radius:8px;

cursor:pointer;

}


.back:hover{

background:#4DA8FF;

color:white;

}




.container{

padding:40px;

}




.card{

background:#111827;

border:1px solid #1E293B;

border-radius:15px;

padding:30px;

margin-bottom:25px;

box-shadow:0 0 20px rgba(77,168,255,.15);

}




.card h2{

color:#4DA8FF;

margin-bottom:20px;

}



.info p{

margin:12px 0;

color:#cbd5e1;

}




table{

width:100%;

border-collapse:collapse;

}



th{

background:#050816;

color:#4DA8FF;

padding:15px;

text-align:left;

}



td{

padding:15px;

border-bottom:1px solid #1E293B;

}




.status{

background:#f59e0b;

padding:6px 15px;

border-radius:20px;

}




</style>


</head>


<body>



<div class="header">


<h1>

<i class="fas fa-file-invoice"></i>

Order Details

</h1>



<button class="back"
onclick="back()">


<i class="fas fa-arrow-left"></i>

Orders


</button>


</div>






<div class="container">



<div class="card">


<h2>
Customer & Order Information
</h2>


<div id="orderInfo"
class="info">


</div>


</div>







<div class="card">


<h2>

Products

</h2>



<table>


<thead>

<tr>


<th>
Product
</th>


<th>
Quantity
</th>


<th>
Unit Price
</th>


<th>
Total
</th>


</tr>


</thead>


<tbody id="itemList">


</tbody>


</table>


</div>








<div class="card">


<h2>

Delivery Information

</h2>


<div id="deliveryInfo"
class="info">


</div>


</div>





</div>





<script src="admin-order-details.js"></script>


</body>

</html>

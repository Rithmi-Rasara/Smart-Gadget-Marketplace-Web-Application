<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <title>Admin Products | Smart Gadget Marketplace</title>

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Segoe UI", sans-serif;
      }

      body {
        background: #0a0f1f;
        color: white;
      }

      .header {
        background: #050816;

        padding: 20px 40px;

        display: flex;

        justify-content: space-between;

        align-items: center;

        border-bottom: 1px solid #1e293b;
      }

      .header h1 {
        color: #4da8ff;

        font-size: 28px;
      }

      .back {
        background: #1f2937;

        color: #4da8ff;

        border: 1px solid #4da8ff;

        padding: 10px 25px;

        border-radius: 8px;

        cursor: pointer;
      }

      .back:hover {
        background: #4da8ff;

        color: white;
      }

      .container {
        padding: 40px;
      }

      .top {
        display: flex;

        justify-content: space-between;

        align-items: center;

        margin-bottom: 30px;
      }

      .search {
        width: 350px;

        padding: 14px;

        background: #111827;

        border: 1px solid #1e293b;

        border-radius: 8px;

        color: white;
      }

      .table-box {
        background: #111827;

        border: 1px solid #1e293b;

        border-radius: 15px;

        padding: 25px;

        box-shadow: 0 0 20px rgba(77, 168, 255, 0.15);
      }

      table {
        width: 100%;

        border-collapse: collapse;
      }

      th {
        background: #050816;

        color: #4da8ff;

        padding: 15px;

        text-align: left;
      }

      td {
        padding: 15px;

        border-bottom: 1px solid #1e293b;

        color: #cbd5e1;
      }

      tr:hover {
        background: #1f2937;
      }

      .status {
        padding: 6px 14px;

        border-radius: 20px;

        background: #16a34a;

        color: white;

        font-size: 13px;
      }

      .delete {
        background: #ef4444;

        border: none;

        color: white;

        padding: 8px 18px;

        border-radius: 8px;

        cursor: pointer;
      }

      .delete:hover {
        background: #b91c1c;
      }
    </style>
  </head>

  <body>
    <div class="header">
      <h1>
        <i class="fas fa-box"></i>

        Manage Products
      </h1>

      <button class="back" onclick="back()">
        <i class="fas fa-arrow-left"></i>

        Dashboard
      </button>
    </div>

    <div class="container">
      <div class="top">
        <h2>All Products</h2>

        <input
          class="search"
          id="search"
          placeholder="Search Product..."
          onkeyup="searchProduct()"
        />
      </div>

      <div class="table-box">
        <table>
          <thead>
            <tr>
              <th>ID</th>

              <th>Product Name</th>

              <th>Seller</th>

              <th>Category</th>

              <th>Price</th>

              <th>Stock</th>

              <th>Status</th>

              <th>Action</th>
            </tr>
          </thead>

          <tbody id="productList"></tbody>
        </table>
      </div>
    </div>

    <script src="admin-products.js"></script>
  </body>
</html>

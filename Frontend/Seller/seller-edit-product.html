<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <title>Edit Product | Seller Panel</title>

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Segoe UI";
      }

      body {
        background: #0a0f1f;
        color: white;
        display: flex;
      }

      /* SIDEBAR */

      .sidebar {
        width: 260px;
        height: 100vh;
        position: fixed;

        background: #050816;

        border-right: 1px solid #1e293b;

        padding: 25px 20px;
      }

      .logo {
        font-size: 24px;
        color: #4da8ff;
        margin-bottom: 40px;
      }

      .logo i {
        margin-right: 10px;
      }

      .menu a {
        display: flex;
        align-items: center;

        gap: 15px;

        padding: 15px;

        margin-bottom: 10px;

        color: #cbd5e1;

        text-decoration: none;

        border-radius: 10px;
      }

      .menu a:hover,
      .menu .active {
        background: #1e293b;
        color: #4da8ff;
      }

      .logout {
        position: absolute;

        bottom: 30px;

        width: 220px;

        padding: 12px;

        background: #111827;

        border: 1px solid #4da8ff;

        color: #4da8ff;

        border-radius: 8px;

        cursor: pointer;
      }

      /* MAIN */

      .main {
        margin-left: 260px;

        width: calc(100% - 260px);
      }

      .header {
        background: #050816;

        padding: 25px 40px;

        border-bottom: 1px solid #1e293b;
      }

      .header h1 {
        color: #4da8ff;
      }

      /* CARD */

      .container {
        padding: 40px;

        display: flex;

        justify-content: center;
      }

      .card {
        width: 700px;

        background: #111827;

        padding: 40px;

        border-radius: 20px;

        border: 1px solid #1e293b;

        box-shadow: 0 0 30px rgba(77, 168, 255, 0.2);
      }

      .icon {
        text-align: center;

        margin-bottom: 25px;
      }

      .icon i {
        font-size: 80px;

        color: #4da8ff;
      }

      h2 {
        text-align: center;

        color: #4da8ff;

        margin-bottom: 30px;
      }

      /* FORM */

      .form-grid {
        display: grid;

        grid-template-columns: 1fr 1fr;

        gap: 20px;
      }

      .input-box {
        display: flex;

        flex-direction: column;
      }

      .input-box label {
        color: #94a3b8;

        margin-bottom: 8px;

        font-size: 14px;
      }

      input,
      textarea {
        padding: 13px;

        background: #0a0f1f;

        color: white;

        border: 1px solid #334155;

        border-radius: 10px;

        outline: none;
      }

      input:focus,
      textarea:focus {
        border-color: #4da8ff;

        box-shadow: 0 0 10px #4da8ff;
      }

      textarea {
        height: 120px;

        resize: none;
      }

      .full {
        grid-column: 1/3;
      }

      .buttons {
        display: flex;

        gap: 20px;

        margin-top: 35px;
      }

      button {
        flex: 1;

        padding: 14px;

        border: none;

        border-radius: 10px;

        cursor: pointer;

        font-size: 16px;

        color: white;
      }

      .save {
        background: #4da8ff;
      }

      .save:hover {
        background: #2563eb;
      }

      .cancel {
        background: #374151;
      }

      .cancel:hover {
        background: #4b5563;
      }
    </style>
  </head>

  <body>
    <div class="sidebar">
      <div class="logo">
        <i class="fas fa-store"></i>

        Seller Panel
      </div>

      <div class="menu">
        <a href="seller-dashboard.html">
          <i class="fas fa-home"></i>
          Dashboard
        </a>

        <a href="seller-products.html" class="active">
          <i class="fas fa-box"></i>
          Products
        </a>

        <a href="seller-orders.html">
          <i class="fas fa-cart-shopping"></i>
          Orders
        </a>

        <a href="seller-profile.html">
          <i class="fas fa-user"></i>
          Profile
        </a>
      </div>

      <button class="logout" onclick="logout()">
        <i class="fas fa-sign-out-alt"></i>
        Logout
      </button>
    </div>

    <div class="main">
      <div class="header">
        <h1>
          <i class="fas fa-edit"></i>

          Edit Product
        </h1>
      </div>

      <div class="container">
        <div class="card">
          <div class="icon">
            <i class="fas fa-box-open"></i>
          </div>

          <h2>Update Product</h2>

          <div class="form-grid">
            <div class="input-box">
              <label> Product Name </label>

              <input id="name" />
            </div>

            <div class="input-box">
              <label> Price </label>

              <input id="price" />
            </div>

            <div class="input-box">
              <label> Stock Quantity </label>

              <input id="stock" />
            </div>

            <div class="input-box">
              <label> Status </label>

              <input id="status" readonly />
            </div>

            <div class="input-box full">
              <label> Description </label>

              <textarea id="description"></textarea>
            </div>
          </div>

          <div class="buttons">
            <button class="cancel" onclick="back()">
              <i class="fas fa-arrow-left"></i>

              Cancel
            </button>

            <button class="save" onclick="updateProduct()">
              <i class="fas fa-save"></i>

              Update Product
            </button>
          </div>
        </div>
      </div>
    </div>

    <script>
      const productId = new URLSearchParams(window.location.search).get("id");

      // ===============================
      // LOAD PRODUCT DATA
      // ===============================

      document.addEventListener("DOMContentLoaded", () => {
        loadProduct();
      });

      async function loadProduct() {
        try {
          const response = await fetch(
            "http://localhost:3000/api/seller/product/" + productId,
          );

          const data = await response.json();

          console.log("Product Data:", data);

          // existing values load

          document.getElementById("name").value = data.PRODUCT_NAME || "";

          document.getElementById("description").value = data.DESCRIPTION || "";

          document.getElementById("price").value = data.PRICE || "";

          document.getElementById("stock").value = data.STOCK_QUANTITY || "";

          document.getElementById("status").value = data.STATUS || "ACTIVE";
        } catch (error) {
          console.log(error);

          alert("Product loading failed");
        }
      }

      // ===============================
      // UPDATE PRODUCT
      // ===============================

      async function updateProduct() {
        const productData = {
          product_name: document.getElementById("name").value,

          description: document.getElementById("description").value,

          price: Number(document.getElementById("price").value),

          stock_quantity: Number(document.getElementById("stock").value),
        };

        console.log("Sending:", productData);

        try {
          const response = await fetch(
            "http://localhost:3000/api/seller/products/" + productId,

            {
              method: "PUT",

              headers: {
                "Content-Type": "application/json",
              },

              body: JSON.stringify(productData),
            },
          );

          const result = await response.json();

          console.log(result);

          if (result.success) {
            alert("Product Updated Successfully");

            window.location.href = "seller-products.html";
          } else {
            alert(result.message);
          }
        } catch (error) {
          console.log(error);

          alert("Update Failed");
        }
      }

      function back() {
        window.location.href = "seller-products.html";
      }
    </script>
  </body>
</html>

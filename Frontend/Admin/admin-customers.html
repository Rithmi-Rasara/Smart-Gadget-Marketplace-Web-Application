<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<title>Admin Customers | Smart Gadget Marketplace</title>


<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">


<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Segoe UI',sans-serif;
}


body{

background:#0A0F1F;
color:white;

}


/* HEADER */

.header{

background:#050816;

padding:20px 40px;

display:flex;

justify-content:space-between;

align-items:center;

border-bottom:1px solid #1E293B;

}


.header h1{

color:#4DA8FF;

}


.back{

background:#1F2937;

color:#4DA8FF;

border:1px solid #4DA8FF;

padding:10px 25px;

border-radius:8px;

cursor:pointer;

}



.back:hover{

background:#4DA8FF;

color:white;

}




.container{

padding:40px;

}



.title{

font-size:30px;

color:#4DA8FF;

margin-bottom:25px;

}



/* SEARCH */

.search-box{

background:#111827;

padding:20px;

border-radius:12px;

margin-bottom:25px;

border:1px solid #1E293B;

}


.search-box input{

width:100%;

padding:14px;

background:#1F2937;

border:none;

border-radius:8px;

color:white;

font-size:15px;

}



/* TABLE */

.table-box{

background:#111827;

border-radius:15px;

overflow:hidden;

border:1px solid #1E293B;

box-shadow:0 0 25px rgba(77,168,255,.15);

}



table{

width:100%;

border-collapse:collapse;

}


thead{

background:#050816;

}


th{

padding:18px;

color:#4DA8FF;

text-align:left;

}


td{

padding:16px;

border-bottom:1px solid #1E293B;

color:#cbd5e1;

}


tr:hover{

background:#1F2937;

}



/* STATUS */


.status{

padding:6px 15px;

border-radius:20px;

font-size:13px;

}



.active{

background:#16a34a;

}


.blocked{

background:#ef4444;

}



/* BUTTON */

.delete{

background:#ef4444;

color:white;

padding:8px 15px;

border:none;

border-radius:8px;

cursor:pointer;

}


.delete:hover{

background:#dc2626;

}



.empty{

text-align:center;

padding:40px;

color:#94a3b8;

}



</style>


</head>



<body>



<div class="header">


<h1>

<i class="fas fa-users"></i>

Manage Customers

</h1>



<button class="back"
onclick="back()">

<i class="fas fa-arrow-left"></i>

Dashboard

</button>



</div>






<div class="container">


<h2 class="title">

Customer Accounts

</h2>




<div class="search-box">


<input

id="search"

placeholder="Search customer..."

onkeyup="searchCustomer()">



</div>






<div class="table-box">


<table>


<thead>

<tr>

<th>ID</th>

<th>Name</th>

<th>Email</th>

<th>Phone</th>

<th>City</th>

<th>Status</th>

<th>Action</th>

</tr>


</thead>



<tbody id="customerList">


</tbody>



</table>



</div>





</div>





<script src="admin-customers.js"></script>


</body>

</html>
